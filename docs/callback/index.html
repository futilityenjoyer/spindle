<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Never send the OAuth code to any other site via the Referer header. -->
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Spindle sign-in</title>
  <!--
    Spotify only accepts HTTPS (or loopback) redirect URIs, so Spotify sends the
    sign-in result here. This page forwards it to the Spindle app's private URL
    scheme, where ASWebAuthenticationSession intercepts it. The code is useless
    without the PKCE verifier that only the app holds. No external resources,
    no analytics, nothing stored.
  -->
  <style>
    :root { color-scheme: light dark; --bg: #f5f5f7; --ink: #1d1d1f; --ink2: #6e6e73; --link: #0a66d8; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0c; --ink: #f5f5f7; --ink2: #a1a1a6; --link: #4c9dff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
           font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 0 16px; }
    main { max-width: 22rem; text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { color: var(--ink2); margin: 0; }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Returning to Spindle…</h1>
    <p id="msg">If nothing happens, <a id="link" href="#">tap here to open Spindle</a>.</p>
  </main>
  <script>
    (function () {
      var incoming = new URLSearchParams(window.location.search);
      // Forward only the fields an OAuth authorization response contains.
      var out = new URLSearchParams();
      ["code", "state", "error"].forEach(function (key) {
        var value = incoming.get(key);
        if (value !== null) out.set(key, value);
      });

      if (!out.has("state")) {
        document.getElementById("title").textContent = "Nothing to do here";
        document.getElementById("msg").textContent = "This page only finishes a Spotify sign-in started from the Spindle app.";
        return;
      }

      var target = "dev.spindlevinyl.auth://callback?" + out.toString();
      document.getElementById("link").href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>

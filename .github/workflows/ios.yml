name: ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core package tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/Core

  build-ipa:
    name: IPA
    needs: core-tests
    # Pinned: the M0 spin test confirmed the widget rotation works on iOS 27.2
    # when built with Xcode 26.6 (2026-11-12). Change only after re-testing the spin.
    runs-on: macos-26
    timeout-minutes: 40
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "### $(xcodebuild -version | head -1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build, ad-hoc sign with entitlements, package IPA
        run: bash scripts/make-ipa.sh Spindle

      - uses: actions/upload-artifact@v4
        with:
          name: Spindle
          path: build/Spindle.ipa
          retention-days: 14
          if-no-files-found: error
